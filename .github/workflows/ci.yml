name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  VALKEY_REPO_URL: https://github.com/valkey-io/valkey.git
  TEST_FRAMEWORK_REPO: https://github.com/valkey-io/valkey-test-framework
  TEST_FRAMEWORK_DIR: tests/build/valkeytestframework

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server_version: ['unstable', '8.0', '8.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set the server version for python integration tests
      run: echo "SERVER_VERSION=${{ matrix.server_version }}" >> $GITHUB_ENV
    - name: Run cargo and clippy format check
      run: |
        cargo fmt --check
        cargo clippy --profile release --all-targets
    - name: Release Build
      run: |
        if [ "${{ matrix.server_version }}" = "8.0" ]; then
          cargo build --all --all-targets --release --features valkey_8_0
        else
          cargo build --all --all-targets --release
        fi
    - name: Run unit tests
      run: cargo test --features enable-system-alloc
    - name: Make valkey-server binary
      run: |
        mkdir -p "tests/build/binaries/${{ matrix.server_version }}"
        cd tests/build
        git clone "${{ env.VALKEY_REPO_URL }}"
        cd valkey
        git checkout ${{ matrix.server_version }}
        make -j
        cp src/valkey-server ../binaries/${{ matrix.server_version }}/
    - name: Set up test framework
      run: |
        echo "Cloning test framework..."
        git clone ${{ env.TEST_FRAMEWORK_REPO }}
        mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
        mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
        rm -rf valkey-test-framework
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Update module path
      run: echo "MODULE_PATH=$(realpath target/release/libvalkey_bloom.so)" >> $GITHUB_ENV
    - name: Run integration tests 
      run: python -m pytest --cache-clear -v "tests/" 
  
  build-macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run cargo and clippy format check
      run: |
        cargo fmt --check
        cargo clippy --profile release --all-targets
    - name: Release Build
      run: cargo build --all --all-targets --release
    - name: Run unit tests
      run: cargo test --features enable-system-alloc

  rust-asan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: default
          features: enable-system-alloc
        - name: valkey_8_0
          features: valkey_8_0,enable-system-alloc
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      RUSTFLAGS: -Zsanitizer=address
      CARGO_TARGET_DIR: target/rust-asan
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust nightly
      run: rustup toolchain install nightly --profile minimal
    - name: Run Rust tests with address and leak detection
      shell: bash
      run: |
        mkdir -p sanitizer-results
        rust_target=$(rustc +nightly -vV | sed -n 's/^host: //p')
        # An explicit target keeps sanitizer flags off host build scripts and macros.
        set +e
        cargo +nightly test --target "$rust_target" --features "${{ matrix.features }}" -- --nocapture 2>&1 | tee sanitizer-results/rust-asan.log
        TEST_STATUS=${PIPESTATUS[0]}
        set -e

        if grep -Eq 'ERROR: AddressSanitizer|AddressSanitizer:DEADLYSIGNAL|LeakSanitizer: detected memory leaks' sanitizer-results/rust-asan.log; then
          echo "::error::Rust sanitizer diagnostics detected; see the sanitizer log artifact."
          exit 1
        fi
        exit "$TEST_STATUS"
    - name: Upload Rust sanitizer log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-asan-${{ matrix.name }}
        path: sanitizer-results/
        retention-days: 14

  asan-build:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    strategy:
      fail-fast: false
      matrix:
        server_version: ['unstable', '8.0', '8.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set the server version for python integration tests
      run: echo "SERVER_VERSION=${{ matrix.server_version }}" >> $GITHUB_ENV
    - name: Run cargo and clippy format check
      run: |
        cargo fmt --check
        cargo clippy --profile release --all-targets
    - name: Release Build
      run: |
        if [ "${{ matrix.server_version }}" = "8.0" ]; then
          cargo build --all --all-targets --release --features valkey_8_0
        else
          cargo build --all --all-targets --release
        fi
    - name: Run unit tests
      run: cargo test --features enable-system-alloc
    - name: Make Valkey-server binary with asan
      run: |
        mkdir -p "tests/build/binaries/${{ matrix.server_version }}"
        cd tests/build
        git clone "${{ env.VALKEY_REPO_URL }}"
        cd valkey
        git checkout ${{ matrix.server_version }}
        make distclean
        make -j SANITIZER=address SERVER_CFLAGS='-Werror' BUILD_TLS=module
        cp src/valkey-server ../binaries/${{ matrix.server_version }}/
    - name: Set up test framework
      run: |
        echo "Cloning test framework..."
        git clone ${{ env.TEST_FRAMEWORK_REPO }}
        mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
        mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
        rm -rf valkey-test-framework
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Update module path
      run: echo "MODULE_PATH=$(realpath target/release/libvalkey_bloom.so)" >> $GITHUB_ENV
    - name: Run integration tests 
      shell: bash
      run: |
        mkdir -p sanitizer-results
        # Preserve pytest's exit status while still reporting sanitizer output.
        set +e
        python -m pytest --capture=sys --cache-clear -v "tests/" -m "not skip_for_asan" --junitxml=sanitizer-results/junit.xml 2>&1 | tee sanitizer-results/server-asan.log
        PYTEST_STATUS=${PIPESTATUS[0]}
        set -e

        if grep -Eq 'ERROR: AddressSanitizer|AddressSanitizer:DEADLYSIGNAL|LeakSanitizer: detected memory leaks' sanitizer-results/server-asan.log; then
          echo "::error::Server sanitizer diagnostics detected; see the sanitizer log artifact."
          exit 1
        fi
        exit "$PYTEST_STATUS"
    - name: Upload server sanitizer reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: server-asan-${{ matrix.server_version }}
        path: sanitizer-results/
        retention-days: 14
